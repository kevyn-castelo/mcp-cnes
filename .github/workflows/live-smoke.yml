name: Live smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-smoke
  cancel-in-progress: false

jobs:
  official-sources:
    name: ElastiCNES and Portal SUS connectivity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.1"
          python-version: "3.11"
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --locked

      - name: Run authorized live source smokes
        env:
          CNES_RUN_LIVE_TESTS: "1"
        run: uv run pytest tests/live -m live -q
