name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Ruff, Pyright and pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.1"
          python-version: "3.11"
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check src tests mcp_server.py benchmarks

      - name: Pyright
        run: uv run pyright

      - name: pytest
        run: uv run pytest -m "not live"
