name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-security:
    name: Audit locked runtime dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.1"
          python-version: "3.11"
          enable-cache: true

      - name: Export all locked requirements
        run: >-
          uv export --locked --all-groups --no-editable --no-emit-project
          --format requirements.txt --output-file "$RUNNER_TEMP/requirements.txt"

      - name: Audit dependencies with pip-audit
        run: >-
          uvx --from "pip-audit==2.10.1" pip-audit
          --requirement "$RUNNER_TEMP/requirements.txt"
          --format json --progress-spinner off

  dependency-review:
    name: Review dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject newly introduced high-severity vulnerabilities
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  quality:
    name: Ruff, Pyright and pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.1"
          python-version: "3.11"
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check src tests benchmarks

      - name: Pyright
        run: uv run pyright

      - name: Unit tests
        run: >-
          uv run pytest tests/unit -m "not live"
          --ignore=tests/unit/test_mcp_sdk_contract.py

      - name: Integration tests
        run: uv run pytest tests/integration -m "not live"

      - name: Contract tests
        run: >-
          uv run pytest tests/unit/test_mcp_sdk_contract.py -m "not live"

      - name: Coverage gate
        run: >-
          uv run pytest tests/unit tests/integration -m "not live"
          --cov=mcp_cnes.domain --cov=mcp_cnes.application
          --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Publish coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
