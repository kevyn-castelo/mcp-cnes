name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-security:
    name: Audit locked runtime dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.1"
          python-version: "3.11"
          enable-cache: true

      - name: Export locked runtime requirements
        run: >-
          uv export --locked --no-dev --no-editable --no-emit-project
          --format requirements.txt --output-file "$RUNNER_TEMP/requirements.txt"

      - name: Audit dependencies with pip-audit
        run: >-
          uvx --from "pip-audit==2.10.1" pip-audit
          --requirement "$RUNNER_TEMP/requirements.txt"
          --format json --progress-spinner off

  quality:
    name: Ruff, Pyright and pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.1"
          python-version: "3.11"
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check src tests mcp_server.py benchmarks

      - name: Pyright
        run: uv run pyright

      - name: Unit tests
        run: >-
          uv run pytest tests/unit -m "not live"
          --ignore=tests/unit/test_contract_baseline.py
          --ignore=tests/unit/test_mcp_sdk_contract.py

      - name: Integration tests
        run: uv run pytest tests/integration -m "not live"

      - name: Contract tests
        run: >-
          uv run pytest tests/unit/test_contract_baseline.py
          tests/unit/test_mcp_sdk_contract.py tests/contract -m "not live"

      - name: Coverage gate
        run: >-
          uv run pytest tests/unit tests/integration -m "not live"
          --cov=mcp_cnes.domain --cov=mcp_cnes.application
          --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Publish coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-xml
          path: coverage.xml
